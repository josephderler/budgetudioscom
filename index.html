        <p>
          Dora: Explore and Play! is an interactive learning adventure game for
          toddlers and preschoolers, featuring Dora the Explorer. Young children
          explore vibrant worlds, learn new words (including basic Spanish), make
          music, help friends, and enjoy fun activities. The gameplay is simple,
          frustration-free and built for small hands. Published by BUD STUDIO LTD.
        </p>

        <ul>

          <li>Make music and discover sounds.</li>
          <li>Help friends and complete fun activities.</li>
          <li>
            Safe for children — holds the ESRB Privacy Certified Kids' Privacy
            Seal.
